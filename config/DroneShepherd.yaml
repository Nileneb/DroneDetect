behaviors:
  DroneShepherd:
    trainer_type: ppo
    hyperparameters:
      batch_size: 512
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        strength: 0.5
        gamma: 0.99
        demo_path: Assets/Demonstrations/DroneSessions/
        learning_rate: 3.0e-4
        use_actions: true
        use_vail: false
    keep_checkpoints: 5
    max_steps: 1500000
    time_horizon: 128
    summary_freq: 5000
    checkpoint_interval: 100000
    # Initial model: Curriculum-Phase-4 startet mit DroneCSI als Pretraining-Basis.
    # init_path: results/v8_1/DroneCSI.onnx → ML-Agents resume/initial-load via CLI flag.

environment_parameters:
  wind_strength: 0.4
  # Episode-Länge in Sekunden — wird im ShepherdGameManager.roundDuration verbraucht.
  shepherd_round_duration: 300.0
