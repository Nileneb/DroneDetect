behaviors:
  WolfAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 5120
      learning_rate: 3.0e-4
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        strength: 0.5
        demo_path: Assets/Demonstrations/WolfSessions/
        learning_rate: 3.0e-4
        use_actions: false
    max_steps: 500000
    time_horizon: 64
    summary_freq: 5000
    keep_checkpoints: 5
