# DroneDetect ML-Agents Trainer Configuration
# =============================================
#
# WORKFLOW — Imitation Learning (Lernen am Modell):
#
#   SCHRITT 1: Demo aufnehmen
#     1. Unity öffnen
#     2. Agent-GameObject auswählen → "Add Component" → "Demonstration Recorder"
#        - Record = true
#        - Demonstration Name = "DroneRouteDemo"
#        - Demonstration Directory = "Assets/Demonstrations"
#     3. Behavior Parameters → Behavior Type = "Heuristic Only"
#     4. Play drücken → Route mit WASD abfliegen → Stop
#     5. .demo Datei wird in Assets/Demonstrations/ gespeichert
#
#   SCHRITT 2: Training starten
#     Terminal: mlagents-learn config/drone_training.yaml --run-id=drone_route_v1
#     Dann in Unity Play drücken
#
#   SCHRITT 3: Nur PPO (ohne Demo)
#     Wenn kein demo_path angegeben → reines Reinforcement Learning
#

behaviors:
  DroneCSI:
    trainer_type: ppo

    # ═══ BC: MAXIMAL ═══
    behavioral_cloning:
      demo_path: Assets/Demonstrations/DroneRouteDemo.demo
      strength: 1.0            # MAXIMUM — Demo hat absolute Priorität
      steps: 200000            # Sehr lange aktiv
      batch_size: 128
      num_epoch: 5

    # ═══ GAIL: STARK ═══
    reward_signals:
      extrinsic:               # Dein normaler Reward (Targets etc.)
        strength: 0.3          # NIEDRIG am Anfang — Demo ist wichtiger
        gamma: 0.99
      gail:
        demo_path: Assets/Demonstrations/DroneRouteDemo.demo
        strength: 0.7          # HOCH — GAIL-Reward dominiert
        gamma: 0.99
        encoding_size: 128
        use_actions: true      # GAIL schaut auch auf Aktionen, nicht nur Zustände
        learning_rate: 0.0003

    hyperparameters:
      learning_rate: 0.00005   # Sehr niedrig — nicht von Demo weglernen
      batch_size: 256
      buffer_size: 4096
      beta: 0.01               # Etwas Entropy für Exploration
      epsilon: 0.1             # Kleine Policy-Updates
      num_epoch: 4

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2

    max_steps: 1500000
    time_horizon: 128

# ═══ CURRICULUM ═══
environment_parameters:
  parcours_difficulty:
    curriculum:
      - name: Level0_EinTarget
        completion_criteria:
          measure: reward
          behavior: DroneCSI
          min_lesson_length: 100
          threshold: 0.0           # Cum. Reward muss im Schnitt ≥ 0 sein
        value: 0.0

      - name: Level1_ZweiTargets
        completion_criteria:
          measure: reward
          behavior: DroneCSI
          min_lesson_length: 100
          threshold: 0.0           # 2 Targets konsistent erreichen
        value: 1.0

      - name: Level2_VierTargets
        completion_criteria:
          measure: reward
          behavior: DroneCSI
          min_lesson_length: 100
          threshold: 0.0           # Alle 4 Targets konsistent erreichen
        value: 2.0

      - name: Level3_Hindernisse
        value: 3.0

# Physik-Stabilisierung: time_scale reduziert wegen Motor-Response-Time (~150ms Lag)
engine_settings:
  time_scale: 1.2
