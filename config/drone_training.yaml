# DroneDetect ML-Agents Trainer Configuration
# =============================================
#
# WORKFLOW — Imitation Learning (Lernen am Modell):
#
#   SCHRITT 1: Demo aufnehmen
#     1. Unity öffnen
#     2. Agent-GameObject auswählen → "Add Component" → "Demonstration Recorder"
#        - Record = true
#        - Demonstration Name = "DroneRouteDemo"
#        - Demonstration Directory = "Assets/Demonstrations"
#     3. Behavior Parameters → Behavior Type = "Heuristic Only"
#     4. Play drücken → Route mit WASD abfliegen → Stop
#     5. .demo Datei wird in Assets/Demonstrations/ gespeichert
#
#   SCHRITT 2: Training starten
#     Terminal: mlagents-learn config/drone_training.yaml --run-id=drone_route_v1
#     Dann in Unity Play drücken
#
#   SCHRITT 3: Nur PPO (ohne Demo)
#     Wenn kein demo_path angegeben → reines Reinforcement Learning
#

behaviors:
  DroneCSI:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 1024       # Groesser fuer stabileres Lernen
      buffer_size: 20480
      learning_rate: 1.0e-4  # Kleiner → stabiler bei Physik-Simulation
      beta: 0.01             # Mehr Exploration am Anfang
      epsilon: 0.2           # PPO Clip-Range
      lambd: 0.95            # GAE lambda
      num_epoch: 3
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2          # 2 reicht, 3 kann overfitting bei 14 Observations

    reward_signals:
      extrinsic:
        gamma: 0.99          # 0.995 war zu hoch fuer kurze Episoden
        strength: 1.0

    # Behavioral Cloning: direkt von Demo-Actions lernen
    # BC-first Setup fuer stabile Imitation, PPO uebernimmt spaeter feinere Optimierung
    behavioral_cloning:
      demo_path: Assets/Demonstrations/DroneRouteDemo.demo
      strength: 0.3          # Leicht erhoehte BC-Gewichtung fuer stabileres Imitationslernen
      steps: 200000          # Laengere BC-Phase (~10% von max_steps) fuer solide Basis
      batch_size: 1024
      num_epoch: 3

    max_steps: 2000000       # 2M Steps fuer kontinuierliche Drohnensteuerung
    time_horizon: 512        # Groesser → bessere Reward-Zuordnung bei Physik-Lag
    summary_freq: 10000      # Weniger Log-Spam bei laengeren Runs
    keep_checkpoints: 10
    checkpoint_interval: 100000

# Physik-Stabilisierung: time_scale reduziert wegen Motor-Response-Time (~150ms Lag)
engine_settings:
  time_scale: 3
