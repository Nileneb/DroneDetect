# DroneFollow PPO, warm-started by behavioral cloning and GAIL. Currently from the scripted expert
# (DroneDetect > DroneFollow > Record Scripted Expert Demonstration -> DroneFollowDemo.demo); once manual
# Xbox-controller flights exist, point both demo_path entries at results/demonstrations/manual
# (every .demo file there is loaded). The target walks fixed loops on the terrain.
# Policy inputs: 19 vector observations + 84x84 grayscale MiDaS depth; outputs: four continuous actions.
# Landing is not a policy action: the sim lands after the walk, the operator lands the real drone.
behaviors:
  DroneFollow:
    trainer_type: ppo
    behavioral_cloning:
      demo_path: results/demonstrations/DroneFollowDemo.demo
      strength: 1.0
      steps: 150000
      batch_size: 128
      num_epoch: 5
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      gail:
        demo_path: results/demonstrations/DroneFollowDemo.demo
        strength: 0.3
        gamma: 0.99
        encoding_size: 128
        use_actions: true
        learning_rate: 0.0003
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    max_steps: 500000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 25000

environment_parameters:
  # Path difficulty: an episode picks a loop whose DroneFollowPath.difficulty <= follow_stage.
  # WHY(reward scale): thresholds are mean episode returns. Shaping is paid every 50 Hz physics step, so a
  # clean ~3 min loop earns roughly 9000 steps x ~0.03 + ~13 gates x 0.5 + 0.75 = ~280; losing the person
  # half the time lands near ~110. Thresholds sit near half of a clean run; re-check in TensorBoard.
  follow_stage:
    curriculum:
      - name: FlatPathSlowTarget
        completion_criteria:
          measure: reward
          behavior: DroneFollow
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 130.0
        value: 0
      - name: GentleHills
        completion_criteria:
          measure: reward
          behavior: DroneFollow
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 140.0
        value: 1
      - name: HillsTightTurns
        completion_criteria:
          measure: reward
          behavior: DroneFollow
          signal_smoothing: true
          min_lesson_length: 100
          threshold: 150.0
        value: 2
      - name: FullCourseFasterTarget
        value: 3

# WHY(training-speed): on the default CPU device the Python trainer saturated one core (policy forward per
# step plus CNN/BC/GAIL updates) and capped the editor at ~0.7x real time.
torch_settings:
  device: cuda

env_settings:
  base_port: 5004

engine_settings:
  # WHY(training-speed): ML-Agents fixes 60 rendered frames per scaled second, so time_scale 4 still
  # gives 15 camera frames per simulated second, enough for 10 Hz perception and decisions.
  time_scale: 4
