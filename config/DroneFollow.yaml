behaviors:
  DroneFollow:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 1000000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 10

env_settings:
  base_port: 5004

# No automatic --initialize-from: DroneFollow uses 19 vector values, a
# centered 84x84 grayscale depth image, and hybrid actions. Existing
# DroneFollow and DroneCSI checkpoints do not have this visual input contract.

# Keep editor training at real time so accelerated physics does not starve
# the Unity Editor's ML-Agents step/response loop.
engine_settings:
  time_scale: 1
