# DroneFollow PPO, warm-started by behavioral cloning from the manual demo.
# Policy inputs: 19 vector observations + 84x84 grayscale MiDaS depth;
# outputs: four continuous actions and one discrete (land) branch.
# WHY(sim-to-real): the demo was recorded before the camera/heading/gyro fixes, so its observations
# differ from the current sim. BC only nudges the start (weaker, shorter); GAIL would reward
# reproducing the stale observation distribution and is therefore disabled.
behaviors:
  DroneFollow:
    trainer_type: ppo
    behavioral_cloning:
      demo_path: results/demonstrations/DroneFollowDemo.demo
      strength: 0.5
      steps: 100000
      batch_size: 128
      num_epoch: 5
    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple
    max_steps: 500000
    time_horizon: 128
    summary_freq: 10000
    keep_checkpoints: 10
    checkpoint_interval: 25000

environment_parameters:
  follow_stage:
    curriculum:
      - name: StableCloseTarget
        completion_criteria:
          measure: reward
          behavior: DroneFollow
          signal_smoothing: true
          min_lesson_length: 50
          threshold: 1.5
        value: 0
      - name: GentleTargetMotion
        completion_criteria:
          measure: reward
          behavior: DroneFollow
          signal_smoothing: true
          min_lesson_length: 50
          threshold: 3.0
        value: 1
      - name: ModerateTargetMotion
        completion_criteria:
          measure: reward
          behavior: DroneFollow
          signal_smoothing: true
          min_lesson_length: 50
          threshold: 4.5
        value: 2
      - name: FullTargetMotion
        completion_criteria:
          measure: reward
          behavior: DroneFollow
          signal_smoothing: true
          min_lesson_length: 50
          threshold: 6.5
        value: 3
      - name: LongFlight
        value: 4

env_settings:
  base_port: 5004

engine_settings:
  # WHY(training-speed): ML-Agents fixes 60 rendered frames per scaled second, so time_scale 4 still
  # gives 15 camera frames per simulated second, enough for 10 Hz perception and decisions.
  time_scale: 4
