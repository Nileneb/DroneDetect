default_settings: null
behaviors:
  DroneCSI:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 5.0e-05
      beta: 0.01
      epsilon: 0.1
      lambd: 0.95
      num_epoch: 4
      shared_critic: false
      learning_rate_schedule: linear
      beta_schedule: linear
      epsilon_schedule: linear
    checkpoint_interval: 500000
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 2
      vis_encode_type: simple
      memory: null
      goal_conditioning_type: hyper
      deterministic: false
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 0.3
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
      gail:
        gamma: 0.99
        strength: 0.7
        network_settings:
          normalize: false
          hidden_units: 128
          num_layers: 2
          vis_encode_type: simple
          memory: null
          goal_conditioning_type: hyper
          deterministic: false
        learning_rate: 0.0003
        encoding_size: 128
        use_actions: true
        use_vail: false
        demo_path: Assets/Demonstrations/DroneRouteDemo.demo
    init_path: null
    keep_checkpoints: 5
    even_checkpoints: false
    max_steps: 1500000
    time_horizon: 128
    summary_freq: 50000
    threaded: false
    self_play: null
    behavioral_cloning:
      demo_path: Assets/Demonstrations/DroneRouteDemo.demo
      steps: 200000
      strength: 1.0
      samples_per_update: 0
      num_epoch: 5
      batch_size: 128
