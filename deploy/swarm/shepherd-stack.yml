version: "3.9"

# Docker Swarm stack file for the Shepherd build+deploy pipeline.
# Deploy:
#   docker stack deploy -c deploy/swarm/shepherd-stack.yml shepherd

services:
  # ── WebGL Builder (runs on BigOne, GPU host) ───────────────────────────
  unity-builder:
    image: dronedetect/unity-builder:6000.6.0a3
    networks: [shepherd-net]
    volumes:
      - shepherd-artifacts:/output
      - /home/nileneb/DroneDetect:/project:ro
    environment:
      - UNITY_LICENSE_FILE=/secrets/unity.ulf
      - BUILD_SCENE=Assets/Scenes/ShepherdArena.unity
      - BUILD_TARGET=WebGL
      - BUILD_OUTPUT=/output
    secrets:
      - unity-license
    deploy:
      replicas: 0  # only start on demand: `docker service scale shepherd_unity-builder=1`
      restart_policy:
        condition: none
      placement:
        constraints: [node.labels.role==builder]

  # ── Web Frontend (nginx serving Brotli-compressed WebGL) ───────────────
  shepherd-web:
    image: nginx:1.27-alpine
    networks: [shepherd-net]
    volumes:
      - shepherd-artifacts:/usr/share/nginx/html/shepherd/Build:ro
      - ./nginx/shepherd.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1
      placement:
        constraints: [node.labels.role==web]

networks:
  shepherd-net:
    external: true

volumes:
  shepherd-artifacts:
    driver: local
    driver_opts:
      type: nfs
      o: addr=192.168.178.12,rw,nfsvers=4
      device: ":/srv/shepherd-artifacts"

secrets:
  unity-license:
    external: true
